[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

; Build settings
build_flags = 
    -DESP8266
    -DARDUINO_ARCH_ESP8266
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DVTABLES_IN_FLASH
    -fno-exceptions
    -lstdc++

; Serial monitor settings
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder

; Libraries
lib_deps = 
    ESP8266WiFi
    ESP8266WebServer
    ESP8266mDNS
    ArduinoJson@^6.21.3
    Servo
    EEPROM

; Upload settings
upload_speed = 921600

[env:generic]
platform = espressif8266
board = esp01_1m
framework = arduino

; Build settings for generic ESP8266
build_flags = 
    -DESP8266
    -DARDUINO_ARCH_ESP8266
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DVTABLES_IN_FLASH
    -fno-exceptions
    -lstdc++

; Serial monitor settings
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder

; Libraries
lib_deps = 
    ESP8266WiFi
    ESP8266WebServer
    ESP8266mDNS
    ArduinoJson@^6.21.3
    Servo
    EEPROM

; Upload settings
upload_speed = 115200
